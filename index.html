<!--
  외국어 검색 개선 시제품 (v14, 2026-11-08 2차)
  - 상품·브랜드·고객 문장·건수는 모두 가상이다. 브랜드는 Brand A~G 같은 가명.
  - 「AI」 표시 판단: 2026-11-07 로컬 모델(Qwen2.5 7B Instruct, Apache-2.0) 실행에서 저장한 분류 결과를
    가상 상품명으로 바꿔 옮긴 것. 「AI 추출 표현」은 같은 실행의 customer_phrase 필드다. 화면에서 모델을 부르지 않는다.
    원본은 data/ai_results.json(공개 배포에서 제외). 「제안 검색어」는 이 파일 안의 규칙이 만든 것이며 모델 출력이 아니다.
  - 계정명(ops-kim, pi-seong), 시각, 사전 버전은 모두 시연용 가짜 값이다.
  - 「규칙」 표시 판단: 이 파일 안의 단순 규칙(상품 이름, 흔한 오타, 색·용기·용도 특징).
  - 고객 화면 패턴은 2026-11-08 en.hddfs.com, www.hddfs.com 검색 결과 화면을 관찰해 일반 커머스 패턴으로 다시 그렸다.
    로고·브랜드명·배치는 가져오지 않았다.
  - 글꼴: Pretendard 1.3.9 (SIL OFL 1.1, vendor/pretendard). 아이콘: Tabler Icons(MIT) 선 모양을 따라 그린 인라인 SVG.
-->
<style>
@font-face{font-family:"Pretendard Variable";src:url(vendor/pretendard/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
:root{
 --ink:#1B1E23;--mut:#5C6677;--lt:#ABB2BE;--dk:#3D444F;--bg:#F5F7FA;
 --red:#EA2829;--btn:#D92121;--btn-dk:#B81B1B;--pink:#FFEAEA;
 --line:#E3E6EB;--line2:#EEF0F3;--soft:#F7F8FA;--img:#F1F2F4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
:lang(zh-CN){font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Pretendard Variable",sans-serif}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:14px;height:14px}
.ico.l{width:22px;height:22px}

/* 페이지 틀 */
.top{display:flex;align-items:center;gap:2px 14px;min-height:44px;padding:6px 16px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.top b{font-size:14px;font-weight:700}
.top .flow{font-size:12px;color:var(--dk)}
.top .flow b{color:var(--ink);font-weight:700;background:var(--pink);padding:1px 5px;border-radius:3px}
.top .why{font-size:12px;color:var(--mut)}
.top .reset{margin-left:auto}
.top .brk{flex-basis:100%;height:0}
.top .flow{flex:1 1 auto}
.top .note{margin-left:auto;font-size:12px;color:var(--mut)}
.top .reset{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;color:var(--dk)}
.top .reset:hover{background:var(--soft)}
.top .reset.arm{border-color:var(--btn);color:var(--btn);font-weight:600}
.views{display:none}
.stage{display:grid;grid-template-columns:392px minmax(0,1fr);gap:16px;padding:16px;height:calc(100vh - var(--toph,45px));min-height:640px}
.left{display:flex;flex-direction:column;gap:10px;min-height:0}
.scen{width:392px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.scen .sh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.scen .sh b{color:var(--ink);font-weight:700}
.scen .newc{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px;color:var(--dk)}
.scen .newc:hover{background:var(--soft)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets button .tag{margin:0 0 0 6px;vertical-align:0}
.presets button{max-width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presets button:hover{border-color:var(--lt)}

/* 휴대폰 */
/* 휴대폰 틀: CSS·SVG로 직접 그림 (상표·이미지 없음) */
.phone{position:relative;width:392px;flex:1;min-height:0;max-height:820px;border-radius:58px;background:#1c1c1e;padding:11px;box-shadow:inset 0 0 0 2px #3a3a3c,inset 0 0 0 4px #0b0b0c,0 1px 2px rgba(0,0,0,.1),0 18px 40px rgba(27,30,35,.14)}
.phone:before{content:"";position:absolute;left:-3px;top:150px;width:3px;height:30px;border-radius:2px 0 0 2px;background:#2c2c2e;box-shadow:0 52px 0 #2c2c2e,0 116px 0 #2c2c2e}
.phone:after{content:"";position:absolute;right:-3px;top:210px;width:3px;height:92px;border-radius:0 2px 2px 0;background:#2c2c2e}
.screen{position:relative;height:100%;border-radius:47px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.sbar{position:relative;height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 40px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sbar .isl{position:absolute;left:50%;top:11px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000}
.sbar .ics{display:flex;align-items:center;gap:5px;color:var(--ink)}
.sbar .ics svg{fill:currentColor}
.homebar{position:absolute;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:10}
.app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.ahd{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 0 16px}
.wm{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.wm em{font-style:normal;color:var(--red)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:none;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.ib{position:relative;width:36px;height:36px;border:0;background:none;display:grid;place-items:center;border-radius:8px;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib .n{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sform{display:flex;align-items:center;gap:8px;padding:4px 16px 12px}
.ahd .sform{flex:1;padding:0}
.sbox{position:relative;flex:1;display:flex;align-items:center;height:40px;border-radius:8px;background:var(--img)}
.sbox .ico{position:absolute;left:11px;color:var(--mut)}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox input{width:100%;height:40px;border:0;background:none;padding:0 36px 0 36px;font-size:14px;border-radius:8px;text-overflow:ellipsis}
.sbox input::placeholder{color:#8B93A1}
.sbox input:focus{outline:2px solid var(--ink);outline-offset:-2px}
.sbox .clr{position:absolute;right:6px;width:26px;height:26px;border:0;border-radius:13px;background:none;display:grid;place-items:center;color:var(--mut)}
.blk{padding:16px}
.blk+.blk{border-top:8px solid var(--soft)}
.bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bh h3{font-size:15px;font-weight:700}
.bh button{border:0;background:none;font-size:12px;color:var(--mut);padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;border:1px solid var(--line);border-radius:15px;padding:0 6px 0 12px;font-size:13px;background:#fff}
.chip button{border:0;background:none;padding:0;display:grid;place-items:center;color:var(--lt)}
.chip .go{padding:0;color:var(--ink);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.pop button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:7px 0;font-size:14px;text-align:left}
.pop b{width:14px;font-weight:700;color:var(--ink)}
.pop li:nth-child(n+4) b{color:var(--mut);font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll .card{flex:0 0 128px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 10px}
.card{display:block;width:100%}
.pwrap{position:relative}
.ctap{display:block;border:0;background:none;padding:0;text-align:left;width:100%}
.pimg{aspect-ratio:1;border-radius:6px;background:var(--img);display:grid;place-items:center;overflow:hidden}
.cb-add{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border:0;border-radius:15px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cb-add[disabled]{color:var(--mut);cursor:default}
.pimg svg{width:78%;height:78%}
.card .br{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.01em}
.card .nm{font-size:13px;color:var(--dk);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:4px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.pr .off{color:var(--red);font-weight:700;font-size:14px}
.pr .usd{font-weight:700;font-size:14px}
.pr .krw{font-size:11px;color:var(--mut)}
.rhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;font-size:13px;color:var(--mut)}
.rhd b{color:var(--ink)}
.nores{padding:28px 16px 20px}
.nores h2{font-size:17px;font-weight:700;line-height:1.4}
.nores p{margin-top:4px;font-size:13px;color:var(--mut)}
.dym{margin:0 16px 8px;border:1px solid var(--line);border-radius:10px;padding:14px}
.dym h3{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:10px}
.dym .ai{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--mut)}
.dym .row{display:flex;gap:12px;align-items:center}
.dym .pimg{width:84px;flex:none}
.dym .br{font-size:12px;font-weight:700}
.dym .nm{font-size:14px;line-height:1.4}
.dym .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:14px}
.abtn{height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.abtn.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.abtn.pri:hover{background:var(--btn-dk)}
.abtn:disabled{cursor:default;opacity:1;background:#fff;border-color:var(--line);color:var(--ink)}
.noted{margin:4px 16px 16px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.simh{padding:8px 16px 10px;font-size:15px;font-weight:700}
.tabbar{flex:none;height:72px;border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;padding-bottom:18px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--lt);position:relative}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar .n{position:absolute;top:5px;left:calc(50% + 5px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.ptoast{position:absolute;left:16px;right:16px;bottom:70px;z-index:9;background:rgba(27,30,35,.92);color:#fff;border-radius:8px;padding:11px 14px;font-size:13px;opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}
.ptoast.on{opacity:1;transform:none}
.pd .pimg{border-radius:0;aspect-ratio:1/0.86}
.pd .info{padding:16px}
.pd .br{font-size:13px;font-weight:700}
.pd h2{font-size:17px;font-weight:600;line-height:1.4;margin-top:2px}
.pd .pr .usd,.pd .pr .off{font-size:18px}
.pd .meta{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px;font-size:13px;color:var(--mut);display:grid;grid-template-columns:72px 1fr;row-gap:6px}
.pd .meta b{color:var(--dk);font-weight:500}
.sticky{position:sticky;bottom:0;background:#fff;padding:10px 16px 12px;border-top:1px solid var(--line2)}
.sticky .abtn{width:100%}
.cats li button{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--line2);background:none;padding:15px 16px;font-size:15px;text-align:left}
.bagl li{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.bagl .pimg{width:72px;flex:none}
.bagl .nm{font-size:13px;color:var(--dk)}
.bagl .q{margin-top:6px;display:flex;align-items:center;gap:10px;font-size:13px}
.bagl .q button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center}
.bagl .rm{margin-left:auto;align-self:flex-start;border:0;background:none;color:var(--lt);padding:2px}
.sum{display:flex;justify-content:space-between;padding:16px;font-size:15px}
.sum b{font-size:17px}
.empty{padding:60px 16px;text-align:center;color:var(--mut);font-size:14px}

/* 콘솔 */
.con{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:52px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chd{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;line-height:1.15;letter-spacing:.02em;width:144px;flex:none}
.logo i{width:24px;height:24px;border-radius:5px;background:var(--ink);display:grid;place-items:center}
.logo i:after{content:"";width:3px;height:12px;background:#fff;border-radius:1px}
.gs{flex:1;max-width:420px;position:relative}
.gs input{width:100%;height:34px;border:1px solid var(--line);border-radius:17px;padding:0 34px 0 14px;font-size:13px;background:#fff}
.gs .ico{position:absolute;right:12px;top:8px;color:var(--mut)}
.me{margin-left:auto;position:relative}
.me>button{display:flex;align-items:center;gap:8px;font-size:13px;border:0;background:none;padding:4px 6px;border-radius:6px}
.me>button:hover{background:var(--soft)}
.me i{width:28px;height:28px;border-radius:14px;background:var(--dk);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.me .role{font-size:11px;color:var(--mut);display:block;line-height:1.2}
.menu{position:absolute;right:0;top:42px;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(27,30,35,.1);padding:6px;z-index:20}
.menu .mh{font-size:11px;color:var(--mut);padding:4px 8px}
.menu button{width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:5px;font-size:13px;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--soft)}
.menu button[aria-checked=true]{background:var(--pink);font-weight:700}
.menu button .role{margin-left:auto;font-weight:400}
.cbody{display:grid;grid-template-columns:160px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto;background:#EDF0F4}
.side a{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:6px;color:var(--dk);text-decoration:none;font-size:13px;white-space:nowrap}
.side a:hover{background:var(--line)}
.side a[aria-current=page]{background:var(--pink);color:var(--ink);font-weight:700}
.side a[aria-current=page] .ico{color:var(--btn)}
.side .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
.main{min-width:0;overflow:auto;background:var(--bg);padding:20px 20px 32px}
.ph1{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.ph1 h1{font-size:20px;font-weight:700;line-height:1.3}
.ver{font-size:12px;color:var(--mut);margin-top:3px}
.ver b{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 10px 9px;font-size:13px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button span{margin-left:5px;color:var(--lt)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tabs button[aria-selected=true] span{color:var(--ink)}
.panelbox{background:#fff;border:1px solid var(--line);border-radius:6px}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.b{height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px;color:var(--ink);white-space:nowrap}
.b:hover{background:var(--soft)}
.b.pri{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
.b.pri:hover{background:var(--btn-dk)}
.b:disabled{color:#8B93A1;background:#fff;cursor:default;border-style:dashed}
.b.pri:disabled{background:#F2A6A6;border-color:#F2A6A6;color:#fff;border-style:solid}
.sel{height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px;padding:0 6px}
.tsearch{position:relative;flex:1;min-width:150px}
.tsearch input{width:100%;height:30px;border:1px solid var(--line);border-radius:5px;padding:0 10px 0 30px;font-size:12px}
.tsearch .ico{position:absolute;left:9px;top:8px;color:var(--mut)}
.count{font-size:12px;color:var(--mut);margin-left:4px}
.count b{color:var(--ink)}
.tberr{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--red);display:flex;gap:6px;align-items:flex-start}
.tbok{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dk);display:flex;gap:6px;align-items:flex-start}
.hid{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px dashed var(--lt);border-radius:5px;font-size:12px;color:var(--dk)}
.hid button{border:0;background:none;padding:0;font-size:12px;color:var(--btn);text-decoration:underline;text-underline-offset:2px}
.tw{overflow-x:auto}
.tw td,.tw th,.csb td{overflow-wrap:normal;word-break:keep-all}
.csb{overflow-x:auto}
.csb table{min-width:560px}
table{width:100%;border-collapse:collapse;font-size:13px}
.tw>table{min-width:760px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dk);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.rw{cursor:pointer}
tr.rw:hover td{background:#FAFBFC}

function phraseToks(x){return x.replace(/carry[ -]on/g,'carryon').split(/[^a-z0-9_+\-]+/).filter(Boolean).map(sing)}
function dictMatch(d,qn){
 const t=norm(d.term);if(!t)return false;
 if(d.match==='exact')return qn===t;
 if(hasCJK(t)){const qs=zhNorm(qn),ts=zhNorm(t);if(qs.includes(ts))return true;
  const ti=termInfo(t),qi=termInfo(qn);const qty=qi.types.filter(x=>x!=='x');
  if(qty.length)return false;
  return ti.specs.length>0&&ti.specs.every(w=>qs.includes(w))&&qi.specs.length>=2}
 const need=phraseToks(t),have=phraseToks(qn);
 for(let i=0;i+need.length<=have.length;i++){if(need.every((w,j)=>have[i+j]===w))return true}
 return false;
}
function catalogSearch(qn){return catalogSearchWith(S.dict,qn)}
function catalogSearchWith(dict,qn){
 /* 상품명 검색이 먼저, 사전은 그다음. 판매 안 함 상품을 가리키는 말이 있으면 사전을 쓰지 않는다 */
 let pids=[];
 if(isZh(qn)){
  const s=zhCore(qn).replace(/([a-j])牌/g,(m,a)=>a.toUpperCase()+'牌');
  if(s.length>=2) pids=P.filter(p=>{const nm=`${p.bz}${p.z}`.replace(/\s/g,'');return [...s].every(ch=>nm.includes(ch))||p.zt.includes(s)||CAT[p.c].zh===s}).map(p=>p.id);
 }else{
  const tk=enTokens(qn);
  if(tk.length) pids=P.filter(p=>tk.every(t=>IDX[p.id].has(t))).map(p=>p.id);
 }
 if(pids.length)return {kind:'found',pids};
 if(hasWant(qn))return {kind:'fail'};
 /* 여러 줄이 맞으면 상품을 특정한 줄, 그다음 긴 검색어를 쓴다 */
 const hits=dict.filter(d=>dictMatch(d,qn)).sort((a,b)=>((b.tg.pid?1:0)-(a.tg.pid?1:0))||(norm(b.term).length-norm(a.term).length));
 if(hits.length) return {kind:'hit',pids:targetPids(hits[0].tg),dict:hits.map(d=>d.id)};
 return {kind:'fail'};
}

/* 규칙: 상품 이름, 흔한 오타, 색·용기·용도 */
const COLORS={green:['green','绿'],white:['white','白'],blue:['blue','蓝'],red:['red','红'],pink:['pink','粉'],black:['black','黑']};
const OTHER_EN=/\b(order|ordered|orders|arrived|arrive|refund|return|pickup|pick up|receipt|declined|payment|paid|pay|coupon|cancel|delivery|shipping|open|hours|counter|terminal|passport|flight number)\b/;
const OTHER_ZH=/(订单|退货|退款|付款|支付|取货|提货|营业|收据|优惠券)/;
const GAPN=['pillow','candle','diffuser','incense','kelp','perfume','watch','shampoo','cleanser','海带','颈枕','蜡烛','香薰','香水','洗发水','洁面'];
const VOCAB=(()=>{const v=new Set();P.forEach(p=>{IDX[p.id].forEach(x=>v.add(x));p.attr.forEach(x=>v.add(x))});Object.values(TYPEW).flat().forEach(x=>v.add(x));GAPN.forEach(x=>/[a-z]/.test(x)&&v.add(x));return v})();
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function fix(t){if(VOCAB.has(t)||t.length<5)return [t,null];let best=null,bd=9;for(const v of VOCAB){if(v.length<4)continue;const d=lev(t,v);if(d<bd){bd=d;best=v}}const lim=t.length>=7?2:1;return bd<=lim?[best,`${t}→${best}`]:[t,null]}
function ruleJudge(qn){
 const why=[];
 const zh=isZh(qn);
 if(zh?OTHER_ZH.test(qn):OTHER_EN.test(qn)) return {by:'규칙',r:'other',why:'주문·결제 같은 말'};
 let s,toks;
 if(zh){s=zhCore(qn);ZTYPO.forEach(([a,b])=>{if(s.includes(a)){s=s.split(a).join(b);why.push(`오타 ${a}→${b}`)}})}
 else{toks=enTokens(qn).map(t=>{const [f,w]=fix(t);if(w)why.push('오타 '+w);return f})}
 const has=w=>zh?s.includes(w):toks.includes(w);
 /* 성분 말(green tea 등)이 있으면 그 앞 색 말은 색으로 보지 않고, 상품도 단정하지 않는다 */
 const ing=zh?ING_ZH.filter(w=>s.includes(w)).filter((w,i,a)=>!a.some(x=>x!==w&&x.includes(w))):toks.filter(t=>ING_EN.includes(t));
 const ingCol=zh?(ing.includes('绿茶')?['green']:[]):toks.filter((t,i)=>COLORS[t]&&ING_EN.includes(toks[i+1]));
 const qcol=Object.entries(COLORS).filter(([k,ws])=>ws.some(has)&&!ingCol.includes(k)).map(([k])=>k);
 const scored=[];const typeHit=new Set();const tp=[];
 for(const p of P){
  const tw=zh?p.zt:(TYPEW[p.t]||[]);
  let ty=tw.some(has);
  if(!zh&&p.t==='handcream')ty=has('hand')&&has('cream');
  if(!zh&&p.t==='eyecream')ty=has('eye')&&has('cream');
  if(!zh&&p.t==='cream'&&(has('hand')||has('eye')))ty=false;
  if(!ty)continue;typeHit.add(p.t);
  const at=(zh?p.za:p.attr).filter(has);
  const conflict=qcol.some(c=>!p.col.includes(c));
  if(!conflict)tp.push(p);
  if(!conflict&&at.length) scored.push({p,at});
 }
 scored.sort((a,b)=>b.at.length-a.at.length);
 if(ing.length) return {by:'규칙',r:'none',related:P.filter(p=>typeHit.has(p.t)).map(p=>p.id),why:[...why,`판매 상품에 없는 성분 말 ${ing.join('·')}`,typeHit.size?'같은 종류 제안':'맞는 상품 없음'].join(' · ')};
 if(scored.length&&(scored.length===1||scored[0].at.length>scored[1].at.length)){
  const {p,at}=scored[0];
  return {by:'규칙',r:p.id,why:[...why,'특징 '+at.slice(0,3).join('·'),'종류 '+(zh?p.zt[0]:p.t)].join(' · ')};
 }
 const related=P.filter(p=>typeHit.has(p.t)).map(p=>p.id);
 const gn=GAPN.find(has);
 if(gn) return {by:'규칙',r:'gap',want:'',related:related.filter(id=>!qcol.length||qcol.every(c=>PM[id].col.includes(c))),why:[...why,'판매 목록에 없는 말 '+gn].join(' · ')};
 if(typeHit.size&&qcol.length&&!tp.length) return {by:'규칙',r:'none',related,why:[...why,'색 '+qcol.join('·')+'이 판매 상품과 다름 · 같은 종류 제안'].join(' · ')};
 if(tp.length===1) return {by:'규칙',r:tp[0].id,why:[...why,'종류 '+(zh?tp[0].zt[0]:tp[0].t)+' 판매 상품 1개'].join(' · ')};
 return {by:'규칙',r:'none',why:why.length?why.join(' · ')+' · 맞는 상품 없음':'맞는 말 없음'};

function relatedFor(qn){
 const zh=isZh(qn);const s=zh?zhCore(qn):null;const toks=zh?null:enTokens(qn);
 return P.filter(p=>zh?p.zt.some(w=>s.includes(w)):(TYPEW[p.t]||[]).some(w=>toks.includes(sing(w)))).map(p=>p.id);
}
function judge(qn){
 const st=STORED[qn];
 if(st) return {by:'AI',r:st.r,want:st.want,ko:st.ko,phrase:st.phrase||'',why:'저장된 판단',related:st.r==='gap'?relatedFor(qn):[]};

/* ---------- 검색어 조건: 상품을 특정할 수 있는 말만 사전에 ---------- */
const CONT={p1:['bottle','glass'],p2:['jar','tub'],p3:['pouch','box'],p4:['pouch'],p5:['tube'],p6:['compact'],p7:['tube'],p8:['tube'],p9:['bottle'],p10:['jar']};
const CONT_EN=['bottle','jar','tub','glass','pouch','tube','box','compact'];
const COL_ZH={绿:'green',白:'white',蓝:'blue',红:'red',黑:'black',粉:'pink'};
const CONT_ZH={瓶:'bottle',罐:'jar',管:'tube',盒:'box'};
const USE_EN=['night','nite','sleep','sleeping','bedtime','evening','travel','carryon','mini','daily','hand','eye','face','sheet','seaweed','rich','thick','snow','glow','velvet','firming','calming','luggage','light','fluid'];
const TYPE_EN={serum:'serum',essence:'serum',ampoule:'serum',cream:'cream',moisturizer:'cream',moisturiser:'cream',lotion:'cream',set:'set',kit:'set',mask:'mask',sunscreen:'sunscreen',sunblock:'sunscreen',suncream:'sunscreen',cushion:'cushion',tint:'tint',lipstick:'tint',toner:'toner',candle:'x',pillow:'x',diffuser:'x',perfume:'x',shampoo:'x',cleanser:'x'};
const TYPE_ZH=[['护手霜','handcream'],['眼霜','eyecream'],['精华','serum'],['面霜','cream'],['套装','set'],['面膜','mask'],['防晒','sunscreen'],['气垫','cushion'],['唇釉','tint'],['口红','tint'],['爽肤水','toner'],['化妆水','toner'],['柔肤水','toner'],['蜡烛','x'],['香薰','x'],['颈枕','x'],['香水','x']];
const SPEC_ZH=['粉底','绿瓶','白罐','蓝瓶','晚安','睡前','夜间','旅行','迷你','随身','海藻','清透','光感','丝绒','紧致','舒缓','滋润','厚','雪','小','绿','白','蓝','红','黑','粉'];
const WANT_EN=/\b(kelp|pillow|candle|diffuser|perfume|shampoo|cleanser|brand[ _][f-j])\b/;
const WANT_ZH=/(海带|颈枕|蜡烛|香薰|香水|洗发水|洁面|[f-j]牌)/i;
function hasWant(q){const t=norm(q);return WANT_EN.test(t)||WANT_ZH.test(t)}
/* 성분 말: 판매 상품 어디에도 없는 성분. 앞의 색 말(green tea의 green)은 색으로 보지 않는다 */
const ING_EN=['tea','rose','vitamin','snail','cica','retinol','collagen','honey','rice','centella','aloe','charcoal'];
const ING_ZH=['绿茶','茶','玫瑰','蜗牛','积雪草','芦荟','维生素'];
function termInfo(term){
 const t=norm(term);
 if(isZh(t)){
  let s=zhNorm(t).replace(/[a-j]牌/gi,'');const len=s.length;
  const ings=ING_ZH.filter(w=>s.includes(w));ings.forEach(w=>{s=s.split(w).join('|')});
  const types=[];for(const [w,ty] of TYPE_ZH){if(s.includes(w)){types.push(ty);s=s.split(w).join('|')}}
  const specs=[];for(const w of SPEC_ZH){if(s.includes(w)){specs.push(w);s=s.split(w).join('|')}}
  const colors=[],conts=[];specs.filter(w=>['绿瓶','白罐','蓝瓶','绿','白','蓝','红','黑','粉'].includes(w)).forEach(w=>[...w].forEach(c=>{if(COL_ZH[c])colors.push(COL_ZH[c]);if(CONT_ZH[c])conts.push(CONT_ZH[c])}));
  return {zh:true,t,len,types,specs,colors,conts,brand:null,want:WANT_ZH.test(t),ings};
 }
 const toks=enTokens(t);const has=w=>toks.includes(w);
 let types=[];toks.forEach(w=>{if(TYPE_EN[w])types.push(TYPE_EN[w])});
 if(has('sun')&&types.includes('cream'))types=types.map(x=>x==='cream'?'sunscreen':x);
 if(has('hand')&&types.includes('cream'))types=types.map(x=>x==='cream'?'handcream':x);
 if(has('eye')&&types.includes('cream'))types=types.map(x=>x==='cream'?'eyecream':x);
 const ings=toks.filter(w=>ING_EN.includes(w));const ingCol=toks.filter((w,i)=>COLORS[w]&&ING_EN.includes(toks[i+1]));
 const colors=toks.filter(w=>COLORS[w]&&!ingCol.includes(w));const conts=toks.filter(w=>CONT_EN.includes(w));

}
function prodHasSpec(p,w,zh){
 if(zh){if(p.za.includes(w)||p.z.includes(w))return true;const cs=[...w];return cs.every(c=>(COL_ZH[c]&&p.col.includes(COL_ZH[c]))||(CONT_ZH[c]&&(CONT[p.id]||[]).includes(CONT_ZH[c])))}

function specConflict(i,p){return [...i.colors.filter(c=>!p.col.includes(c)),...i.conts.filter(c=>!(CONT[p.id]||[]).includes(c))]}
/* 사전에 넣어도 되는지: 종류 말 + 특정 말, 대상 상품과 색·용기·종류가 맞을 것 */
function termCheck(term,tg){

 if(i.want)return {ok:false,want:true,why:'판매 안 함 상품을 가리키는 말 · 입점 수요로'};
 if(!i.zh&&/\b(luggage|bag|suitcase|baggage)\b/.test(i.t)&&i.types.includes('set'))return {ok:false,why:'다른 뜻으로 읽힘 (여행 가방)'};
 /* hand·eye는 핸드크림·아이크림을 가리키는 말이라, 다른 종류 말과 붙으면 상품군이 섞인다 (예: hand set) */
 if(!i.zh&&/\b(hand|eye)\b/.test(i.t)&&!i.types.some(x=>x==='handcream'||x==='eyecream'))return {ok:false,why:'다른 상품군과 섞임 (핸드크림·아이크림 말)'};
 if(i.ings.length)return {ok:false,why:`판매 상품에 없는 성분 말 (${i.ings.join('·')})`};
 if(i.zh?i.len<3:i.len<2)return {ok:false,why:i.zh?'중문 두 글자 이하 조각':'한 단어'};
 if(i.zh?i.len>8:i.len>4)return {ok:false,why:'문장처럼 김'};
 const ty=i.types.filter(x=>x!=='x');
 if(!ty.length)return {ok:false,why:'종류 말 없음'};
 if(!i.specs.length)return {ok:false,why:'특정 말(색·용기·용도·브랜드) 없음'};
 if(!tg)return {ok:false,why:'연결 대상 없음'};
 if(tg.cat)return {ok:false,why:'대분류 연결 금지 · 종류나 상품으로'};
 if(tg.type)return ty.includes(tg.type)?{ok:true}:{ok:false,why:'종류가 대상과 다름'};
 const p=PM[tg.pid];
 if(!ty.includes(p.t))return {ok:false,why:'종류가 상품과 다름'};
 const bad=specConflict(i,p);if(bad.length)return {ok:false,conflict:true,why:`색·용기가 상품과 다름 (${bad.join('·')})`};

/* 요청서 안에서 이 검색어가 필요 없는가: 검색어 자체가 이미 찾히고, 이 검색어를 포함한 근거 문장도 이미 모두 찾힘 */

/* ---------- 제안 검색어 (규칙 · 모델 출력 아님) ---------- */
const KW_NOISE=new Set(['friend','bought','cannot','cant','find','gave','up','looking','sold','use','people','going','before','comes','fits','long','small','tiny','little','still','ordered','changed','pls','please','answer','previous','instructions','ignore','all','flight','flights','trip','plane','passport','receipt','checkout','declined','call','order','orders','hotel','room','reed','recommended','recommend']);
/* 원문에 연속으로 나오는 구절만 제안한다(5차 결정). 쉼표 등 문장부호, 불용어, 잡음 말에서 끊고,
   끊긴 구절 안에서 종류 말로 끝나는 2~3낱말(브랜드가 있으면 4낱말)을 고른다.
   중문은 정규화한 글자열(的·用的 등 제거) 안에서 연속인 것만 쓴다 */
const ZH_WANTW=['海带','颈枕','蜡烛','香薰','香水','洗发水','洁面'];
const ZH_CC=['绿瓶','白罐','蓝瓶','绿','白','蓝','红','黑','粉'];
const ZH_LEX=[...new Set([...TYPE_ZH.map(x=>x[0]),...SPEC_ZH,...ZH_WANTW,...ING_ZH])].sort((a,b)=>b.length-a.length);
function zhUnits(s){
 const out=[];let i=0;
 while(i<s.length){
  const m=s.slice(i).match(/^[a-j]牌/i);
  if(m){out.push({w:m[0].toUpperCase(),k:/^[f-j]/i.test(m[0])?'want':'brand'});i+=m[0].length;continue}
  const w=ZH_LEX.find(x=>s.startsWith(x,i));
  if(!w){out.push({w:s[i],k:'o'});i++;continue}
  const ty=(TYPE_ZH.find(x=>x[0]===w)||[])[1];
  out.push({w,k:ZH_WANTW.includes(w)||ty==='x'?'want':ty?'type':ING_ZH.includes(w)?'ing':ZH_CC.includes(w)?'cc':'use'});i+=w.length;
 }
 return out;
}
function enUnits(clause){
 const ws=clause.replace(/carry[ -]on/g,'carryon').replace(/brand ([a-j])\b/g,'brand_$1').split(/[^a-z0-9_+\-]+/).map(t=>t.replace(/^-+|-+$/g,'')).filter(Boolean);
 return ws.map(w=>{const t=/^brand_/.test(w)?w:fix(sing(w))[0];
  const k=STOP.has(t)||KW_NOISE.has(t)?'o':/^brand_[f-j]$/.test(t)||WANT_EN.test(t)?'want':/^brand_/.test(t)?'brand':TYPE_EN[t]==='x'?'want':TYPE_EN[t]?'type':ING_EN.includes(t)?'ing':(COLORS[t]||CONT_EN.includes(t))?'cc':USE_EN.includes(t)?'use':'w';
  return {w:t.replace(/^brand_([a-j])$/,'brand $1').replace('carryon','carry-on'),k}});

function proposeKw(text,pid){
 if(isCmd(text))return [];
 const src=stripPII(text);const zh=isZh(norm(src));
 const join=us=>us.map(u=>u.w).join(zh?'':' ');
 const ok=c=>{const r=termCheck(c,kwTarget(c,pid));return r.ok||r.conflict};
 const wants=[],terms=[];
 const clauses=zh?[zhNorm(norm(src))]:src.toLowerCase().replace(/[‘’"“”'`]/g,'').split(/[,.;:!?()\[\]，。、；：！？]+/);
 for(const cl of clauses){
  const us=zh?zhUnits(cl):enUnits(cl);
  /* 끊긴 구절(run) 나누기 */
  const runs=[];let cur=[];us.forEach(u=>{if(u.k==='o'){if(cur.length)runs.push(cur);cur=[]}else cur.push(u)});if(cur.length)runs.push(cur);
  for(const run of runs){

   const wi=run.findIndex(u=>u.k==='want');

function doSearch(raw){
 raw=String(raw||'').trim().slice(0,120);if(!raw)return;
 const t=now();if(raw===lastSearch.q&&t-lastSearch.t<600)return;lastSearch={q:raw,t};
 const lang=S.lang;
 const qn=norm(stripPII(raw));
 const shown=maskCust(raw,lang);
 S.recent[lang]=[shown,...REC().filter(r=>r!==shown)].slice(0,8);
 let res=qn?catalogSearch(qn):{kind:'fail'};
 if(res.kind==='hit'){
  const d0=S.dict.find(x=>x.id===res.dict[0]);d0.hits++;d0.last=t;d0.log=[{t,q:shown,pids:res.pids},...(d0.log||[])].slice(0,30);
  hist({ev:'검색 성공',target:d0.term,detail:`${shown} → ${targetName(d0.tg)} · 첫 검색 결과`,by:'system',res:'성공',major:false});
  if(S.ui.page==='dict')S.ui.flashDict=res.dict;
 }
 if(res.kind==='fail'){
  const j=judge(qn);
  const cmd=isCmd(raw);
  const prior=S.log.find(r=>r.qn===qn&&r.lang===lang&&r.cust===S.cust&&t-r.t<10000);
  let row=prior;
  if(!row){
   row=mkRow(S.seq.log++,t,lang,lang==='zh'?'中文 앱':'EN 앱',raw,{cust:S.cust});row.fresh=t+3000;S.lastRow=row.id;
   S.log.unshift(row);
   hist({ev:'접수',target:'#'+row.id,detail:row.q+(cmd?' · 명령 문장':''),by:'system',res:cmd?'확인 필요':'신규',major:false});
   if(isNarrow()&&S.ui.mv==='c')S.ui.unseen++;
  }
  if(PM[j.r]&&!cmd) res={kind:'suggest',pid:j.r,row:row.id,react:null,by:j.by,related:relatedFor(qn).filter(x=>x!==j.r)};
  else if((j.r==='gap'||(j.related||[]).length)&&!cmd) res={kind:'gap',related:j.related||[],row:row.id};
  else res={kind:'none',row:row.id};
 }
 if(S.expect&&!S.expect.done){S.expect.done=true;const rq=S.reqs.find(x=>x.id===S.expect.req);if(res.pids&&(res.kind==='hit'||res.kind==='found')){if(res.pids.includes(S.expect.pid)){if(rq)rq.reok=true;setStep(5)}else{setStep(4);S.flowNote='다른 상품이 걸림';renderFlow()}}else{setStep(4);S.flowNote='재검색 실패';renderFlow()}}

 else if(res.kind==='suggest'||res.kind==='gap'||res.kind==='none')setStep(1);

 else setStep(0);
 S.c={scr:'results',q:shown,res,prev:S.c.scr==='results'?S.c.prev:S.c.scr};
 save();renderPhone();renderConsole();

/* 반례: 사람이 실제로 칠 만한 비슷한 검색을 만든다. 같은 자리의 말끼리만 바꾼다
   (색은 다른 색, 용기는 다른 용기, 종류는 다른 종류, 「초록 + 용기」는 green tea 같은 성분 말).
   종류 말을 뺀 「green bottle」, 용기만 남긴 「glass bottle」도 넣는다. 걸리면서 다른 상품을 가리키면 경고 */

  if(tt)CX_ZH.types.filter(ty=>ty!==tt[0]).slice(0,2).forEach(ty=>add(tn.replace(tt[0],ty)));
  if(oc)CX_ZH.colors.filter(c=>c!==oc).slice(1,2).forEach(c=>add(tn.replace(oc,c)));

 }

 const ci=w.findIndex(x=>cls(x)==='c'),ki=w.findIndex(x=>cls(x)==='k'),ti=w.findIndex(x=>cls(x)==='t');
 if(ci>=0)add(sub(ci,CX_EN.colors.find(c=>c!==w[ci])));
 if(ci>=0&&ki===ci+1&&w[ci]==='green')add(sub(ki,'tea'));
 if(ki>=0&&w[ki]!=='glass')add(`glass ${w[ki]}`);
 if(ti>=0)add(sub(ti,CX_EN.types.find(y=>y!==w[ti])));

}

 rreject:()=>{const r=curReq();if(!r||r.st!=='reg'||isOps())return;const w=(document.getElementById('rejwhy')?.value||'').trim();if(!w){ctoast('반려 사유를 적으세요');document.getElementById('rejwhy')?.focus();return}

 csave:()=>{
  const r=curReq();if(!r||r.st!=='sent'||isOps())return;const c=r.check=r.check||{};
  c.supply=document.getElementById('csup').value.trim();c.zone=document.getElementById('czone').value;c.alt=document.getElementById('calt').value.trim();
  if(!c.zone){S.ui.cerr='판매 구역을 고르세요';S.ui.keepScroll=true;save();renderConsole();return}
  r.st='done';r.doneT=now();S.ui.cerr='';
  hist({ev:'MD 회신 기록',target:r.id,detail:`공급 ${c.supply||'—'} · ${c.zone} · 대신 산 상품 ${c.alt||'—'}`,res:'확인 완료'});
  S.ui.keepScroll=true;save();renderConsole();ctoast('회신 기록됨');
 },
 rdel:()=>{
  const r=curReq();if(!r||r.st!=='draft'||!isOps())return;
  releaseRows(r);S.reqs=S.reqs.filter(x=>x!==r);hist({ev:'요청서 삭제',target:r.id,detail:r.title,res:'삭제'});save();go('#/requests');ctoast(r.id+' 삭제됨');
 },
 hmaj:el=>{S.ui.hMajor=el.dataset.v==='1';save();renderConsole()},
};

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(S.ui.menu&&!e.target.closest('.me')){S.ui.menu=false;renderConsole()}return}
 if(el.disabled||el.getAttribute('aria-disabled')==='true'&&!['rreg','rapply'].includes(el.dataset.act))return;

});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;
 if(f==='search'){const v=e.target.querySelector('input').value;document.activeElement?.blur?.();doSearch(v)}
 if(f==='gs'){const v=document.getElementById('gsq').value.trim();if(!v)return;
  const up=v.toUpperCase();if(/^(PI|MD)-\d{4}$/.test(up)&&S.reqs.some(r=>r.id===up)){go('#/requests/'+up);return}
  const lv=v.toLowerCase();
  const dm=S.dict.some(d=>d.term.includes(lv));
  const lm=S.log.some(r=>r.q.toLowerCase().includes(lv)||(PM[r.auto.r]?pkr(PM[r.auto.r]).toLowerCase().includes(lv):false));
  if(!lm&&dm){S.ui.dq=v;S.ui.dTab='all';go('#/dict')}else{S.ui.q=v;S.ui.tab='all';S.ui.ch='';S.ui.au='';go('#/inbox')}}
});
document.addEventListener('input',e=>{
 const id=e.target.id;const v=e.target.value;
 if(id==='iq'){S.ui.q=v;save();renderConsole()}
 else if(id==='dq'){S.ui.dq=v;save();renderConsole()}
 else if(id==='hq'){S.ui.hq=v;save();renderConsole()}
 else if(id==='jwant'){S.ui.draft.want=v;save()}
 else if(id==='rejwhy'){S.ui.rejWhy=v}
 else if(e.target.dataset.act==='txwhy'){const r=curReq();if(r){r.terms[+e.target.dataset.i].xwhy=v;save();refreshA(r)}}
 else if(id==='rtitle'){const r=curReq();if(r){r.title=v;if(r.type==='PI')r.titleManual=v!==autoTitle(r);save();refreshV(r)}}
 else if(id==='rwhy'){const r=curReq();if(r&&r.st==='draft'){r.why=v;save();refreshV(r)}}
 else if(id==='eterm'&&S.ui.edit){S.ui.edit.term=v;save()}
});
function refreshA(r){
 const vb=document.querySelector('.vbar');if(!vb||r.st!=='reg'||isOps())return;const ai=applyIssues(r);
 vb.className='vbar '+(ai.length?'no':'ok');vb.querySelector('.lbl').textContent=ai.length?`등록됨 · 반영 전 확인 ${ai.length}`:'등록됨';
 let ul=vb.querySelector('ul');if(ai.length){if(!ul){ul=document.createElement('ul');vb.querySelector('.lbl').after(ul)}ul.innerHTML=ai.map(x=>`<li>${esc(x)}</li>`).join('')}else ul?.remove();
 const b=vb.querySelector('[data-act=rapply]');if(b){if(ai.length)b.setAttribute('aria-disabled','true');else b.removeAttribute('aria-disabled')}
}
function refreshV(r){
 const vb=document.querySelector('.vbar');if(!vb)return;const is=reqIssues(r);
 vb.className='vbar '+(is.length?'no':'ok');vb.querySelector('.lbl').textContent=is.length?`등록 불가 · 확인 필요 ${is.length}`:'등록 가능';
 let ul=vb.querySelector('ul');if(is.length){if(!ul){ul=document.createElement('ul');vb.querySelector('.lbl').after(ul)}ul.innerHTML=is.map(x=>`<li>${esc(x)}</li>`).join('')}else ul?.remove();
 const reg=vb.querySelector('[data-act=rreg]');if(reg){if(is.length)reg.setAttribute('aria-disabled','true');else reg.removeAttribute('aria-disabled')}
 if(S.ui.rtry===r.id){document.getElementById('rtitle')?.classList.toggle('err-f',!r.title.trim());document.getElementById('rwhy')?.classList.toggle('err-f',!r.why.trim())}
}
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-act=impd]')){S.ui.impOpen=e.target.open;save()}},true);
document.addEventListener('change',e=>{
 const id=e.target.id;const v=e.target.value;const el=e.target;
 if(id==='fch'){S.ui.ch=v;S.ui.err='';S.ui.blk={};save();renderConsole()}
 else if(id==='fau'){S.ui.au=v;S.ui.err='';S.ui.blk={};save();renderConsole()}
 else if(id==='jpid'){S.ui.draft.pid=v;S.ui.jerr='';save()}
 else if(id==='jreason'){S.ui.draft.reason=v;S.ui.jerr='';save()}
 else if(['elang','ematch'].includes(id)&&S.ui.edit){S.ui.edit[{elang:'lang',ematch:'match'}[id]]=v;save()}
 else if(id==='etg'&&S.ui.edit){S.ui.edit.tg=parseTg(v);save()}
 else if(el.dataset.act==='ttg'){const r=curReq();if(r&&r.st==='draft'){const i=el.dataset.i;r.terms[+i].tg=parseTg(v);retitle(r);S.ui.keepScroll=true;save();renderConsole();document.querySelector(`[data-act=ttg][data-i="${i}"]`)?.focus()}}
 else if(el.dataset.act==='kwtg'){const r=S.log.find(x=>x.id===S.ui.open);if(r){r.kwt=r.kwt||{};r.kwt[el.dataset.k]=parseTg(v);save()}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if(S.ui.menu){S.ui.menu=false;renderConsole();return}
  if(S.ui.edit){ACT.ecancel();return}
  if(S.ui.rejOpen){ACT.rrejclose();return}
  if(S.ui.page==='inbox'&&S.ui.open){closeDrawer();return}
 }
 if(e.key==='Enter'){
  const t=e.target;
  if(t.matches('tr[data-act]')){e.preventDefault();ACT[t.dataset.act](t,e)}
  else if(t.id==='kwin'){e.preventDefault();ACT.kwadd()}
  else if(t.id==='tin'){e.preventDefault();ACT.tadd()}
  else if(t.id==='eterm'){e.preventDefault();ACT.esave()}
  else if(t.id==='jwant'){e.preventDefault();ACT.jsave()}
  else if(t.id==='rejwhy'){e.preventDefault();ACT.rreject()}
 }
});
/* 주소 해시는 콘솔 메뉴를 가리킨다. 좁은 화면에서 해시가 바뀌면 콘솔(관리자) 화면을 보여 준다 */
window.addEventListener('hashchange',()=>{if(isNarrow()&&S.ui.mv!=='a')setView('a',true);route()});
/* 초기화: 화면 안에서 한 번 더 눌러야 처음 상태로 (4초 안에) */
let resetArm=0;

document.getElementById('reset').addEventListener('click',()=>{
 const b=document.getElementById('reset');
 if(!resetArm){b.textContent='한 번 더 누르면 처음 상태로';b.classList.add('arm');chromeH();resetArm=setTimeout(disarmReset,4000);return}
 disarmReset();
 try{sessionStorage.removeItem(KEY)}catch(e){}S=fresh();lastSearch={q:'',t:0};history.replaceState(null,'','#/inbox');setView('c',true);renderPresets();renderPhone();renderFlow();route();chromeH()});

window.addEventListener('resize',()=>{chromeH();if(!isNarrow())document.getElementById('stage').dataset.v=S.ui.mv});
setInterval(()=>{const s=document.querySelector('.sbar .clk');if(s)s.textContent=fmt(now()).slice(6)},30000);

/* 시작 */
chromeH();renderPresets();renderPhone();renderFlow();

if(location.hash&&!hadState)S.ui.mv='a';

route();

<script id="guide">
/* ---------- 가이드 모드 ----------
   기존 화면 위에 스포트라이트와 말풍선만 덧씌운다. 상태를 바꾸는 일은 사용자가 실제 버튼을 눌러 기존 함수가 한다.
   가이드가 직접 하는 일은 화면 전환(고객·관리자 탭, 콘솔 메뉴 주소)과 처음 상태로 되돌리기(초기화 버튼 두 번)뿐이다.
   [건너뛰기]와 ← 키만 같은 실제 버튼을 대신 눌러 단계를 채운다.
   주소 규칙: ?mode=free는 자유 체험, ?mode=guide는 가이드, 둘 다 없고 #/메뉴 주소가 있으면 자유 체험으로 그 화면,
   둘 다 없으면 시나리오 선택 화면. 가이드 상태는 sessionStorage(hddf-guide-v1)에만 둔다 */
(()=>{
'use strict';
const GKEY='hddf-guide-v1';
const boot=window.__hddfBoot||{hash:'',search:''};
const store={get(){try{return JSON.parse(sessionStorage.getItem(GKEY)||'null')}catch(e){return null}},set(v){try{sessionStorage.setItem(GKEY,JSON.stringify(v))}catch(e){}}};
const q1=s=>document.querySelector(s);
/* 화면에 실제로 보이는가: 닫힌 details 안의 내용은 Chrome에서도 상자가 남아 있어 따로 거른다 */
const vis=el=>{if(!el||!el.isConnected||!el.getClientRects().length)return false;const d=el.closest('details:not([open])');if(d&&!el.closest('summary'))return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0};
const rowOf=id=>S.log.find(r=>r.id===id);
const reqBy=id=>S.reqs.find(r=>r.id===id);
const rowByQ=q=>S.log.find(r=>r.q===q);
const pn=pid=>PM[pid]?pkr(PM[pid]):'';
const cb=id=>q1(`#con input[data-act=sel][data-id="${id}"]`);
const judgeBtn=id=>q1(`#con button.lnk[data-act=open][data-id="${id}"]`);
const act=(a,x='')=>q1(`#con [data-act=${a}]${x}`);
const preset=i=>q1(`#scen [data-act=preset][data-i="${i}"]`);
const PRE=i=>PRESETS[i][0];
const evN=r=>r.ev.filter(e=>!e.off).length;
const kpiNow=()=>{const d0=kpiDay0();return [S.log.filter(r=>r.st==='new').length,S.log.filter(r=>r.t>=d0&&r.t<d0+864e5).length,S.reqs.filter(r=>r.st==='draft'||r.st==='reg').length,S.log.filter(x=>S.dict.some(d=>x.t>d.t&&dictMatch(d,x.qn))).length]};
/* 단계 안의 지금 누를 곳: target(data-guide 값), el(실제 요소), label(버튼 이름), before(말풍선 1문장) */
const H=(target,el,label,before,o={})=>({target,el,label,before,...o});
const searched=(i,c)=>{const r=S.c.res;if(S.c.scr==='results'&&S.c.q===PRE(i)&&r&&r.row){c.row=r.row;return true}return false};
const checkSub=(c,ids,line)=>{const id=ids.find(x=>!S.ui.sel.includes(x));return id==null?null:H('row-check',()=>cb(id),`#${id} 체크`,()=>line(id,ids.indexOf(id)))};
const regCur=(pri,fill,priLine)=>c=>{const r=reqBy(c.req);if(!r)return null;
 if(r.pri!==pri)return H('priority',()=>act('rpri',`[data-p="${pri}"]`),pri,()=>priLine(r));
 const ta=q1('#rwhy');
 if(!r.why.trim()||(ta&&document.activeElement===ta))return H('reason',()=>q1('#rwhy'),'이유',()=>'PI 담당이 읽을 우선순위 이유를 이 칸에 한 줄로 적습니다.',{input:true,fill,extra:()=>r.why.trim()?[act('rreg')]:[]});
 return H('register',()=>act('rreg'),'등록',()=>'결론과 근거와 우선순위가 채워졌으니 [등록]으로 PI 담당에게 넘깁니다.')};
const reqPage=c=>'#/requests/'+c.req;

/* ---------- 시나리오 데이터 ----------
   단계 = { id, kind: human|ai|system, role, tab, target, name, before(cur 안), after, page, cur, done }
   화면 값(접수 번호, 건수, 상품명, 요청서 번호)은 모두 상태 S에서 읽는다 */
const SCEN={
A:{title:'판매 중인 상품을 설명으로 찾음',time:'약 3분',desc:'이름 없이 설명한 문장이 운영 담당 확인과 PI 반영을 거쳐 다음 고객의 첫 검색 결과가 되기까지 따라갑니다.',
 end:c=>'같은 말로 찾은 다음 고객은 첫 검색에서 상품을 받습니다.',
 steps:[
 {id:'a1',name:'설명 문장으로 검색',kind:'human',role:'고객',tab:'고객',target:'example-green',
  cur:c=>H('example-green',()=>preset(0),PRE(0),()=>`친구가 산 상품을 이름 없이 설명한 「${PRE(0)}」 문장으로 검색합니다.`),
  done:c=>searched(0,c),
  after:c=>`「${PRE(0)}」 검색은 결과가 0건이라 검색 실패 접수 #${c.row}로 남았습니다.`},
 {id:'a2',name:'AI 상품 제안',kind:'ai',role:'고객',tab:'고객',target:'ai-suggestion-card',
  cur:c=>H('ai-suggestion-card',()=>q1('#screen .dym'),'',()=>`이름 없이 쓴 문장에서 AI가 판매 중인 ${pn(rowOf(c.row).auto.r)} 상품을 골라 Did you mean 카드로 제안합니다.`)},
 {id:'a3',name:'제안 상품 담기',kind:'human',role:'고객',tab:'고객',target:'add-to-bag',
  cur:c=>H('add-to-bag',()=>q1('#screen [data-act=addsug]'),'Add to bag',()=>'제안이 맞으면 고객이 [Add to bag]을 누르고 그 반응이 운영 화면의 근거로 남습니다.'),
  done:c=>rowOf(c.row).react==='bag',
  after:c=>`${pn(rowOf(c.row).auto.r)} 상품이 가방에 담기고 접수 #${c.row}에 고객 반응 「담음」이 기록됐습니다.`},
 {id:'a4',name:'검색 실패 접수',kind:'system',role:'운영 담당',tab:'관리자',target:'inbox-new-row',page:()=>'#/inbox',
  cur:c=>H('inbox-new-row',()=>q1(`#con tr.rw[data-id="${c.row}"]`),'',()=>`결과가 없던 검색이라 검색 실패 접수 맨 위에 #${c.row} 줄이 새로 들어왔습니다.`)},
 {id:'a5',name:'자동 판단 확인',kind:'ai',role:'운영 담당',tab:'관리자',target:'auto-judgment-cell',page:()=>'#/inbox',
  cur:c=>H('auto-judgment-cell',()=>q1(`#con tr.rw[data-id="${c.row}"] td:nth-child(4)`),'',()=>`AI가 고객 문장을 읽고 찾는 상품을 ${pn(rowOf(c.row).auto.r)} 상품으로 판단해 AI 배지와 함께 이 칸에 적었습니다.`)},
 {id:'a6',name:'같은 상품 줄 선택 확인',kind:'human',role:'운영 담당',tab:'관리자',target:'bulk-confirm',page:()=>'#/inbox',
  enter:c=>{if(!c.picks){const n=rowOf(c.row);c.picks=[n.id,...S.log.filter(r=>r.id!==n.id&&r.st==='new'&&r.auto.r===n.auto.r&&!bulkSkip(r)).map(r=>r.id)].slice(0,3)}},
  cur:c=>checkSub(c,c.picks,(id,k)=>`같은 상품으로 판단된 ${c.picks.length}줄 가운데 ${k+1}번째인 #${id} 줄을 체크합니다.`)||H('bulk-confirm',()=>act('bconfirm'),'선택 확인',()=>`체크한 ${c.picks.length}줄을 자동 판단대로 맞음 처리하려고 [선택 확인]을 누릅니다.`),
  done:c=>c.picks.every(id=>rowOf(id).st!=='new'),
  after:c=>`${c.picks.length}줄이 확인됨으로 바뀌어 검토 전이 ${kpiNow()[0]}건이 됐습니다.`},
 {id:'a7',name:'PI 요청서로 묶기',kind:'human',role:'운영 담당',tab:'관리자',target:'bundle-pi',page:()=>'#/inbox',
  cur:c=>checkSub(c,c.picks,id=>`묶을 줄 #${id}를 다시 체크합니다.`)||H('bundle-pi',()=>act('bundle','[data-t=PI]'),'PI 요청서로 묶기',()=>`확인한 ${c.picks.length}줄을 한 장의 PI 요청서로 묶어 검색어 연결을 요청합니다.`),
  done:c=>{const r=S.reqs.find(x=>x.type==='PI'&&x.ev.some(e=>e.lid===c.row));if(r)c.req=r.id;return !!r},
  after:c=>{const r=reqBy(c.req);return `${r.id} 요청서가 작성 중으로 만들어졌고 연결할 검색어 ${r.terms.filter(t=>t.on).length}개가 들어갔습니다.`}},

 if(key===lastBub)return;lastBub=key;note(text);
 const rc=role==='운영 담당'?'r-ops':role==='PI 담당'?'r-pi':'';
 const aux=st.kind==='human'?`<span>${cur.input?'이 칸에 직접 적으면 진행합니다':'이 버튼을 눌러 진행합니다'}</span>`:`<button type="button" class="g-next" data-g="next">${ai?'확인했어요':'다음'}</button>`;
 ui.bub.className='g-bub g-ui'+(ai?' ai':'')+(sheet()?' sheet'+(sheetTop?' top':''):'');ui.hole.className='g-hole g-ui'+(ai?' ai':'');
 ui.bub.setAttribute('aria-label',`${role} 단계 안내`);
 ui.bub.innerHTML=`<div class="g-bh"><span class="g-chip ${rc}">${esc(role)}</span>${ai?`<span class="g-chip k-ai">${esc(st.badge||'AI 판단')}</span>`:st.kind==='system'?'<span class="g-chip">시스템</span>':''}<span class="g-n">${G.i+1} / ${steps().length}</span></div><p>${esc(text)}</p><div class="g-aux">${aux}</div>`;
}

/* ---------- 위치 ---------- */
const sheet=()=>innerWidth<=760;
let sheetTop=false,nudged=0;
function clipRect(el){
 const b=el.getBoundingClientRect();let r={l:b.left,t:b.top,r:b.right,b:b.bottom};
 for(let p=el.parentElement;p&&p!==document.body&&p!==document.documentElement;p=p.parentElement){const cs=getComputedStyle(p);if(/(auto|scroll|hidden|clip)/.test(cs.overflowX+cs.overflowY)){const q=p.getBoundingClientRect();r={l:Math.max(r.l,q.left),t:Math.max(r.t,q.top),r:Math.min(r.r,q.right),b:Math.min(r.b,q.bottom)}}}
 r={l:Math.max(r.l,0),t:Math.max(r.t,0),r:Math.min(r.r,innerWidth),b:Math.min(r.b,innerHeight)};
 return r.r>r.l&&r.b>r.t?r:null;
}
function unionRect(es){let u=null;es.forEach(e=>{const r=clipRect(e);if(!r)return;u=u?{l:Math.min(u.l,r.l),t:Math.min(u.t,r.t),r:Math.max(u.r,r.r),b:Math.max(u.b,r.b)}:r});return u}
const sheetH=()=>ui.bub?ui.bub.offsetHeight:0;
function fully(el){const b=el.getBoundingClientRect();const r=clipRect(el);if(!r)return false;const lim=sheet()?innerHeight-sheetH():innerHeight;return Math.abs(r.l-Math.max(b.left,0))<2&&Math.abs(r.t-b.top)<2&&Math.abs(r.r-b.right)<2&&Math.abs(r.b-b.bottom)<2&&b.bottom<=lim-6}
function scrollParent(el){for(let p=el.parentElement;p;p=p.parentElement){const cs=getComputedStyle(p);if(/(auto|scroll)/.test(cs.overflowY)&&p.scrollHeight>p.clientHeight+1)return p}return null}
function bringIn(el){
 el.scrollIntoView({block:'center',inline:'nearest'});
 if(sheet())lift(el);
}
/* 휴대폰 너비: 아래 시트에 가리면 대상을 위로 올리고, 더 못 올리면 시트를 화면 위쪽으로 옮긴다 */
function lift(el){
 const top=innerHeight-sheetH()-8;let b=el.getBoundingClientRect();
 if(b.bottom<=top)return;
 const d=Math.min(b.bottom-top,b.top-8);if(d<=0)return;
 const sp=scrollParent(el);if(sp)sp.scrollTop+=d;
 b=el.getBoundingClientRect();if(b.bottom>top)window.scrollBy(0,Math.min(b.bottom-top,b.top-8));
}
let liveEls=[];
function place(){
 requestAnimationFrame(place);
 const st=step();if(!st||!cur||!ui.hole){liveEls=[];return}
 const es=els(cur);liveEls=es;
 if(!es.length){ui.hole.style.display='none';ui.bub.style.display='none';return}
 if(es[0]!==lastEl){lastEl=es[0];nudged=0;sheetTop=false;if(!fully(es[0]))bringIn(es[0])}
 else if(sheet()&&nudged<3&&!fully(es[0])){nudged++;bringIn(es[0])}
 const r=unionRect(es);
 if(!r){ui.hole.style.display='none';return}
 const pad=4;Object.assign(ui.hole.style,{display:'',left:r.l-pad+'px',top:r.t-pad+'px',width:r.r-r.l+pad*2+'px',height:r.b-r.t+pad*2+'px'});
 ui.bub.style.display='';
 if(sheet()){
  const sh=sheetH();const want=r.b>innerHeight-sh-8&&r.t>=sh+8;
  if(want!==sheetTop)sheetTop=want;
  ui.bub.classList.add('sheet');ui.bub.classList.toggle('top',sheetTop);placeToast();return}
 ui.bub.classList.remove('sheet','top');
 const bw=ui.bub.offsetWidth,bh=ui.bub.offsetHeight,m=12,vw=innerWidth,vh=innerHeight;
 const T={l:r.l-pad,t:r.t-pad,r:r.r+pad,b:r.b+pad};
 const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
 const cands=[[cl(T.l,8,vw-bw-8),T.b+m],[cl(T.l,8,vw-bw-8),T.t-m-bh],[T.r+m,cl(T.t,8,vh-bh-8)],[T.l-m-bw,cl(T.t,8,vh-bh-8)],[vw-bw-16,vh-bh-16],[16,vh-bh-16],[vw-bw-16,70],[16,70]];
 const ok=([x,y])=>x>=8&&y>=8&&x+bw<=vw-8&&y+bh<=vh-8&&(x+bw<=T.l||x>=T.r||y+bh<=T.t||y>=T.b);
 const [x,y]=cands.find(ok)||[cl((vw-bw)/2,8,vw-bw-8),vh-bh-12];
 ui.bub.style.left=x+'px';ui.bub.style.top=y+'px';
}

/* ---------- 진행 ---------- */
function ensure(st,force){
 if(!st)return;
 const want=st.tab==='고객'?'c':'a';
 if(isNarrow()&&S.ui.mv!==want)setView(want);
 if(S.ui.menu){S.ui.menu=false;renderConsole()}
 const pg=st.page?st.page(G.c):null;
 if(pg&&!location.hash.startsWith(pg)){location.hash=pg;return}
 if(pg==='#/inbox'){const u=S.ui;if(u.tab!=='all'||u.q||u.ch||u.au){u.tab='all';u.q='';u.ch='';u.au='';u.keepScroll=true;renderConsole()}}
 if(force&&pg&&pg.startsWith('#/requests/')&&Object.keys(S.ui.csec||{}).length){S.ui.csec={};renderConsole()}
}
function enter(){
 const st=step();if(!st)return;
 if(st.enter)st.enter(G.c);
 const prev=G.i>0?steps()[G.i-1].role:null;
 ensure(st,false);
 if(!replay&&st.role!==prev)banner(`${st.role} 차례입니다`);
 lastEl=null;snap=kpiNow();snapSt=Object.fromEntries(S.log.map(r=>[r.id,r.st]));
 persist();renderBar();tick();
}
function tick(){
 if(!G.on||G.view||running)return;
 const st=step();if(!st)return;
 if(st.kind==='human'&&st.done(G.c)){complete();return}
 cur=st.cur(G.c)||null;
 const es=els(cur);
 document.querySelectorAll('[data-guide]').forEach(e=>{if(!es.includes(e))e.removeAttribute('data-guide')});
 es.forEach(e=>{if(e.dataset.guide!==cur.target)e.setAttribute('data-guide',cur.target)});
 if(!es.length){const t=Date.now();if(!missSince)missSince=t;else if(t-missSince>700){missSince=t;ensure(st,true)}}else missSince=0;
 renderBub();
}
function complete(){
 const st=step();if(!st)return;
 const msg=st.after?st.after(G.c):'';
 if(!replay){toast(msg);flash()}
 advance();
}
function advance(){
 G.i++;cur=null;lastEl=null;
 if(G.i>=steps().length){G.view='end';persist();renderBar();renderBub();if(!replay)setTimeout(()=>{if(G.view==='end')showEnd()},1900);else showEnd();return}
 enter();
}
function flash(){
 const a=snap,b=snapSt;
 setTimeout(()=>{const now=kpiNow();const ks=[...document.querySelectorAll('#con .kpi')];
  now.forEach((v,i)=>{const k=ks[i];if(!a||v===a[i]||!k)return;k.classList.add('g-flash');countUp(k.querySelector('b'),a[i],v);setTimeout(()=>k.classList.remove('g-flash'),800)});
  S.log.forEach(r=>{if(!b||b[r.id]===r.st)return;const t=q1(`#con tr.rw[data-id="${r.id}"]`);if(t){t.classList.add('g-flash');setTimeout(()=>t.classList.remove('g-flash'),800)}})},60);
}
function countUp(el,from,to){if(!el)return;const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/800);if(!el.isConnected)return;el.textContent=String(Math.round(from+(to-from)*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const schedule=()=>{[30,160,420].forEach(ms=>setTimeout(tick,ms))};

/* 처음 상태로: 기존 초기화 버튼을 두 번 누른 것과 같다 */
function resetApp(){autoClick=true;try{const b=q1('#reset');b.click();b.click()}finally{autoClick=false}}
/* 한 단계를 실제 버튼으로 채운다 ([건너뛰기], ← 키) */
async function autoStep(){
 const st=step();if(!st)return false;
 if(st.kind!=='human'){advance();await wait(40);return true}
 for(let k=0;k<24&&!st.done(G.c);k++){
  cur=st.cur(G.c);const es=els(cur);
  if(!es.length){ensure(st,true);await wait(140);continue}
  const el=es[0];
  if(cur.input){el.value=cur.fill;el.dispatchEvent(new Event('input',{bubbles:true}));if(document.activeElement===el)el.blur()}
  else{autoClick=true;try{el.click()}finally{autoClick=false}}
  await wait(90);
 }
 if(!st.done(G.c))return false;
 complete();await wait(60);return true;
}
async function replayTo(n){
 if(running)return;running=true;replay=true;
 try{resetApp();G.c={};G.i=0;G.view=null;hideModal();enter();await wait(60);
  for(let k=0;k<n;k++){if(!(await autoStep()))break}}
 finally{replay=false;running=false}
 lastBub='';enter();
}
async function skip(){
 if(running||!step())return;running=true;
 try{const ok=await autoStep();if(!ok)toast('이 단계는 지금 화면에서 대신 진행할 수 없어 직접 눌러야 합니다.')}finally{running=false}
 schedule();
}
function next(){const st=step();if(!st||st.kind==='human'||running)return;advance()}
function startScen(k){
 G={on:true,scen:k,i:0,c:{},view:null};hideModal();resetApp();setUrl('guide');mountLayer();syncMode();enter();
}
function guideOff(){G={on:false,scen:null,i:0,c:{},view:null};cur=null;persist();unmountLayer();syncMode();setUrl('free')}

/* ---------- 시작 화면과 종료 화면 ---------- */
function hideModal(){if(ui.modal){ui.modal.remove();ui.modal=null}}
function showStart(){
 G={on:true,scen:null,i:0,c:{},view:'start'};persist();mountLayer();renderBar();renderBub();syncMode();hideModal();
 ui.modal=mk('div','g-modal');ui.modal.setAttribute('role','dialog');ui.modal.setAttribute('aria-modal','true');ui.modal.setAttribute('aria-labelledby','g-st-h');
 ui.modal.innerHTML=`<div class="g-card"><div class="g-ch"><h2 id="g-st-h">어떤 장면부터 볼지 고릅니다</h2><button type="button" class="g-x" data-g="free" aria-label="닫고 자유 체험으로">×</button></div>
 <p class="g-sub">각 단계에서 밝게 표시된 실제 버튼을 직접 눌러야 다음 단계로 넘어갑니다.</p>
 <div class="g-scs">${Object.entries(SCEN).map(([k,s],i)=>`<button type="button" class="g-sc ${i?'':'main'}" data-g="start" data-s="${k}"><span class="g-tag ${i?'plain':''}">${i?'시나리오 '+k:'시나리오 A 추천'}</span><b>${esc(s.title)}</b><span>${esc(s.desc)}</span><span class="g-meta">${s.steps.length}단계 ${esc(s.time)}</span></button>`).join('')}</div>
 <div class="g-foot"><span class="g-note">가상 데이터 · 개인 제안 · 현대면세점 공식 서비스 아님</span><button type="button" class="g-btn" data-g="free">자유 체험으로</button></div></div>`;
 document.body.appendChild(ui.modal);setTimeout(()=>ui.modal&&ui.modal.querySelector('.g-sc.main')?.focus(),0);
}
function showEnd(){
 const sc=SCEN[G.scen];if(!sc)return;G.view='end';persist();renderBar();renderBub();hideModal();const t=sc.end(G.c);note(t);
 ui.modal=mk('div','g-modal light');ui.modal.setAttribute('role','dialog');ui.modal.setAttribute('aria-modal','true');ui.modal.setAttribute('aria-labelledby','g-end-h');
 ui.modal.innerHTML=`<div class="g-card g-end"><div class="g-ch"><h2 id="g-end-h">시나리오 ${G.scen} 끝</h2><button type="button" class="g-x" data-g="freekeep" aria-label="닫고 자유 체험으로">×</button></div><p class="g-endt">${esc(t)}</p>
 <div class="g-foot"><button type="button" class="g-btn" data-g="others">다른 시나리오</button><button type="button" class="g-btn pri" data-g="freekeep">자유 체험으로</button></div></div>`;
 document.body.appendChild(ui.modal);setTimeout(()=>ui.modal&&ui.modal.querySelector('.g-btn.pri')?.focus(),0);
}

/* ---------- 가이드 버튼 ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-g]');if(!b||!b.closest('.g-ui'))return;
 const g=b.dataset.g;
 if(g==='start')startScen(b.dataset.s);
 else if(g==='free'){hideModal();guideOff()}
 else if(g==='freekeep'){hideModal();guideOff()}
 else if(g==='others'){hideModal();resetApp();showStart()}
 else if(g==='next')next();
 else if(g==='skip')skip();
 else if(g==='restart'&&G.scen)replayTo(0);
 else if(g==='off')guideOff();
 else if(g==='toguide'){if(!G.on){resetApp();setUrl('guide');showStart()}}
 else if(g==='tofree'){if(G.on){hideModal();resetApp();guideOff()}}
});

/* ---------- 대상 밖 결정 막기 ----------
   읽기 동작(줄 열기·닫기, 탭·메뉴 이동, 접힘·상세 보기, 스크롤)은 그대로 둔다 */
const READ=new Set(['open','close','csec','goack','dlog','view','itab','dtab','rtab','hmaj','ropen','unhide','menu','impd']);
const stop=e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()};
const lbl=()=>{const st=step();return !st?'':st.kind==='ai'?'확인했어요':st.kind==='system'?'다음':(cur&&cur.label)||''};
const blockMsg=()=>G.view==='end'||!step()?'이 시나리오는 끝났고 다른 결정은 자유 체험에서 해 볼 수 있습니다.':`이 시나리오는 [${lbl()}] 기준이라 다른 결정은 자유 체험에서 해 볼 수 있습니다.`;
const inside=(list,el)=>list.some(t=>t&&(t===el||t.contains(el)));
window.addEventListener('click',e=>{
 if(!G.on||autoClick)return;
 if(e.target.closest('.g-ui'))return;
 if(running){stop(e);return}
 if(e.target.closest('#reset')){stop(e);toast('가이드 중에는 위쪽 [처음부터]로 다시 시작합니다.');return}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(cur&&step()){
  /* 체크 상자는 click 시점에 이미 값이 바뀌어 있으므로 직전 화면에서 잡아 둔 대상과도 비교한다 */
  if(inside([...liveEls,...els(cur)],el)){if(cur.guard&&!cur.guard()){stop(e);toast(cur.guardMsg);return}schedule();return}
  if(cur.extra&&inside(cur.extra(),el)){schedule();return}
 }
 if(READ.has(el.dataset.act)){schedule();return}
 stop(e);toast(blockMsg());
},true);
window.addEventListener('submit',e=>{if(!G.on||autoClick)return;if(e.target.dataset.form==='search'){stop(e);toast(blockMsg())}},true);
const ALLOW_IN=new Set(['iq','dq','hq','jwant','gsq','kwin']);
window.addEventListener('input',e=>{
 if(!G.on||autoClick)return;const t=e.target;if(!t.closest||!t.closest('#con'))return;
 if(t.id==='rwhy'&&cur&&cur.target==='reason'){schedule();return}
 if(ALLOW_IN.has(t.id)){schedule();return}
 e.stopImmediatePropagation();S.ui.keepScroll=true;renderConsole();toast(blockMsg());
},true);
window.addEventListener('change',e=>{
 if(!G.on||autoClick)return;const t=e.target;if(!t.closest||!t.closest('#con'))return;
 const a=t.dataset.act;
 if(a==='kwtg'||a==='ttg'||['elang','ematch','etg'].includes(t.id)){e.stopImmediatePropagation();S.ui.keepScroll=true;renderConsole();toast(blockMsg());return}
 schedule();
},true);
window.addEventListener('keydown',e=>{
 if(!G.on)return;const t=e.target;
 if(G.view){if(e.key==='Escape'){stop(e);hideModal();guideOff()}return}
 if(e.key==='Enter'&&t&&['kwin','tin','eterm','jwant','rejwhy'].includes(t.id)){
  if(t.id==='kwin'&&cur&&cur.target==='keyword-add'){schedule();return}
  stop(e);toast(blockMsg());return}
 const typing=t&&(t.tagName==='TEXTAREA'||t.tagName==='SELECT'||(t.tagName==='INPUT'&&!['checkbox','radio','button','submit'].includes(t.type))||t.isContentEditable);
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='ArrowRight'){const st=step();if(st&&st.kind!=='human'){e.preventDefault();next()}}
 else if(e.key==='ArrowLeft'){if(G.scen&&G.i>0){e.preventDefault();replayTo(G.i-1)}}
 else if(e.key==='r'||e.key==='R'){if(G.scen){e.preventDefault();replayTo(0)}}
 else if(e.key==='Escape'){guideOff()}
},true);
window.addEventListener('hashchange',schedule);
window.addEventListener('resize',()=>{lastEl=null;schedule()});
setInterval(tick,400);

/* 시험용 읽기 창 */
window.__guide={
 info:()=>{const st=step();return {on:G.on,view:G.view,scen:G.scen,i:G.i,n:steps().length,kind:st&&st.kind,stepTarget:st&&st.target,role:st&&st.role,target:cur&&cur.target,label:cur&&cur.label,input:!!(cur&&cur.input),fill:cur&&cur.fill,text:cur&&step()?cur.before():'',running}},
 el:()=>els(cur)[0]||null,
 els:()=>els(cur),
 rect:()=>{const es=els(cur);const r=unionRect(es);const b=ui.bub&&ui.bub.style.display!=='none'?ui.bub.getBoundingClientRect():null;return {t:r,b:b&&{l:b.left,t:b.top,r:b.right,b:b.bottom}}},
 texts:()=>shown.slice(),
 data:()=>Object.fromEntries(Object.entries(SCEN).map(([k,s])=>[k,{title:s.title,steps:s.steps.map(x=>({id:x.id,kind:x.kind,role:x.role,tab:x.tab,target:x.target,name:x.name}))}])),
};

/* ---------- 시작 ---------- */
mountBase();
const mode=new URLSearchParams(boot.search).get('mode');
const hashLink=/^#\/./.test(boot.hash||'');
const saved=store.get();
if(mode==='free'){/* 자유 체험 */}
else if(mode==='guide'||(!hashLink&&!mode)){
 if(mode==='guide'&&saved&&saved.on&&saved.scen&&SCEN[saved.scen]){
  if(!hadState)startScen(saved.scen);
  else{G={on:true,scen:saved.scen,i:saved.i||0,c:saved.c||{},view:saved.view==='end'?'end':null};mountLayer();syncMode();if(G.view==='end')showEnd();else enter()}
 }else showStart();
}
place();
})();
</script>
</body>
